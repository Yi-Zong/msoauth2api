<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS OAuth2 Token 管理</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-bg: #eef2ff;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 2rem 1rem 3rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(180deg, #eef3ff 0%, var(--bg) 45%);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 .5rem;
            font-size: 2rem;
            line-height: 1.25;
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--muted);
            font-size: 1rem;
        }

        .status {
            display: none;
            padding: .8rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .status.success {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .status.error {
            background: var(--error-bg);
            color: var(--error-text);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        }

        h2 {
            margin-top: 0;
            margin-bottom: .75rem;
            font-size: 1.2rem;
        }

        p { margin-top: 0; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: .62rem .95rem;
            font-size: .95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform .12s ease, opacity .2s;
        }

        button:hover { transform: translateY(-1px); }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .primary { background: var(--primary); color: #fff; }
        .primary:hover { background: var(--primary-hover); }

        .secondary {
            background: var(--secondary-bg);
            color: #3730a3;
            border: 1px solid #c7d2fe;
        }

        .field {
            margin-bottom: .9rem;
        }

        label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            margin-bottom: .4rem;
            font-size: .93rem;
        }

        .field-row {
            display: flex;
            gap: .5rem;
            align-items: stretch;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: .65rem .7rem;
            font-size: .9rem;
            color: #0f172a;
            background: #fff;
        }

        input[type="text"], input[type="email"] { min-height: 42px; }

        textarea {
            min-height: 100px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
            resize: vertical;
        }

        .copy-btn {
            white-space: nowrap;
            background: #111827;
            color: #fff;
            border-radius: 9px;
            padding: 0 .75rem;
            min-width: 88px;
        }

        .hidden { display: none !important; }

        .hint {
            color: var(--muted);
            font-size: .86rem;
            margin-top: .25rem;
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Microsoft Graph Token 页面</h1>
        <p class="subtitle">登录后可查看并一键复制 <code>client_id</code>、<code>Access Token</code>、<code>Refresh Token</code>。</p>

        <div id="statusBox" class="status"></div>

        <div class="card" id="loginSection">
            <h2>1) 登录获取 Token</h2>
            <p>点击登录后会跳转到 Microsoft 授权页面。授权完成将自动回到本页并保存 Token。</p>
            <div class="actions">
                <button class="primary" onclick="handleLogin()">登录 Microsoft</button>
                <button class="secondary" onclick="clearTokens()">清除本地数据</button>
            </div>
        </div>

        <div class="card hidden" id="tokenSection">
            <h2>2) Token 与 Client 信息</h2>

            <div class="field">
                <label for="clientIdInput">Client ID</label>
                <div class="field-row">
                    <input type="text" id="clientIdInput" placeholder="手动填写你的 Client ID（会保存到本地）">
                    <button class="copy-btn" onclick="copyById('clientIdInput', 'Client ID')">复制</button>
                </div>
            </div>

            <div class="field">
                <label for="accessTokenDisplay">Access Token</label>
                <div class="field-row">
                    <textarea id="accessTokenDisplay" readonly></textarea>
                    <button class="copy-btn" onclick="copyById('accessTokenDisplay', 'Access Token')">复制</button>
                </div>
            </div>

            <div class="field">
                <label for="refreshTokenDisplay">Refresh Token</label>
                <div class="field-row">
                    <textarea id="refreshTokenDisplay" readonly></textarea>
                    <button class="copy-btn" onclick="copyById('refreshTokenDisplay', 'Refresh Token')">复制</button>
                </div>
                <p class="hint">提示：Refresh Token 与 Client ID 会保存在 localStorage，方便下次直接使用。</p>
            </div>

            <div class="actions">
                <button class="primary" onclick="testRefreshToken()">测试刷新 Token</button>
                <button class="secondary" onclick="clearTokens()">清除本地数据</button>
            </div>
        </div>

        <div class="card hidden" id="mailSection">
            <h2>3) 发送测试邮件</h2>
            <div class="field">
                <label for="recipientEmail">收件人邮箱</label>
                <input type="email" id="recipientEmail" placeholder="example@outlook.com">
            </div>
            <div class="field">
                <label for="emailSubject">邮件主题</label>
                <input type="text" id="emailSubject" value="测试邮件来自 Token 页面">
            </div>
            <div class="field">
                <label for="emailBody">邮件内容</label>
                <textarea id="emailBody" style="min-height: 84px;">这是一封通过 Vercel API 发送的测试邮件。</textarea>
            </div>
            <button class="primary" onclick="sendEmail()">发送邮件</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://ms-mail-api.arick.top';

        window.onload = function() {
            checkUrlForCode();
            loadTokensFromStorage();
            bindClientIdInput();
        };

        function bindClientIdInput() {
            const clientIdInput = document.getElementById('clientIdInput');
            clientIdInput.addEventListener('input', () => {
                localStorage.setItem('ms_client_id', clientIdInput.value.trim());
            });
        }

        function handleLogin() {
            window.location.href = `${API_BASE}/api/auth/login`;
        }

        async function checkUrlForCode() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const error = urlParams.get('error');

            if (error) {
                showStatus(`登录失败: ${error}`, 'error');
                return;
            }

            if (!code) return;

            showStatus('正在交换 Token...', 'success');
            try {
                const response = await fetch(`${API_BASE}/api/auth/callback?code=${code}`);
                if (!response.ok) throw new Error('Failed to exchange token');

                const data = await response.json();
                saveTokens(data.access_token, data.refresh_token);

                window.history.replaceState({}, document.title, window.location.pathname);
                showStatus('登录成功！Token 已获取。', 'success');
                loadTokensFromStorage();
            } catch (err) {
                console.error(err);
                showStatus('交换 Token 失败，请检查 API 域名或控制台日志。', 'error');
            }
        }

        function saveTokens(accessToken, refreshToken) {
            localStorage.setItem('ms_access_token', accessToken || '');
            localStorage.setItem('ms_refresh_token', refreshToken || '');
        }

        function loadTokensFromStorage() {
            const accessToken = localStorage.getItem('ms_access_token') || '';
            const refreshToken = localStorage.getItem('ms_refresh_token') || '';
            const clientId = localStorage.getItem('ms_client_id') || '';

            document.getElementById('clientIdInput').value = clientId;
            document.getElementById('accessTokenDisplay').value = accessToken;
            document.getElementById('refreshTokenDisplay').value = refreshToken;

            const hasTokens = Boolean(accessToken && refreshToken);
            document.getElementById('loginSection').classList.toggle('hidden', hasTokens);
            document.getElementById('tokenSection').classList.toggle('hidden', !hasTokens);
            document.getElementById('mailSection').classList.toggle('hidden', !hasTokens);
        }

        function clearTokens() {
            localStorage.removeItem('ms_access_token');
            localStorage.removeItem('ms_refresh_token');
            localStorage.removeItem('ms_client_id');
            location.reload();
        }

        async function testRefreshToken() {
            const refreshToken = localStorage.getItem('ms_refresh_token');
            if (!refreshToken) {
                showStatus('没有可用的 Refresh Token', 'error');
                return;
            }

            showStatus('正在刷新 Token...', 'success');
            try {
                const response = await fetch(`${API_BASE}/api/auth/refresh`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh_token: refreshToken })
                });

                if (!response.ok) throw new Error('Refresh failed');

                const data = await response.json();
                saveTokens(data.access_token, data.refresh_token);
                loadTokensFromStorage();

                showStatus('Token 刷新成功！', 'success');
            } catch (err) {
                console.error(err);
                showStatus('刷新 Token 失败', 'error');
            }
        }

        async function sendEmail() {
            const accessToken = localStorage.getItem('ms_access_token');
            const recipient = document.getElementById('recipientEmail').value.trim();
            const subject = document.getElementById('emailSubject').value;
            const body = document.getElementById('emailBody').value;

            if (!accessToken) {
                showStatus('请先登录获取 Token', 'error');
                return;
            }

            if (!recipient) {
                showStatus('请输入收件人邮箱', 'error');
                return;
            }

            showStatus('正在发送邮件...', 'success');
            try {
                const response = await fetch(`${API_BASE}/api/auth/send-mail`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({
                        subject,
                        bodyContent: body,
                        toRecipients: [recipient]
                    })
                });

                if (response.status !== 200) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Send failed');
                }

                showStatus('邮件发送成功！', 'success');
            } catch (err) {
                console.error(err);
                showStatus(`发送失败: ${err.message}`, 'error');
            }
        }

        async function copyById(id, label) {
            const text = document.getElementById(id).value;
            if (!text) {
                showStatus(`${label} 为空，无法复制`, 'error');
                return;
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const temp = document.createElement('textarea');
                    temp.value = text;
                    temp.style.position = 'fixed';
                    temp.style.opacity = '0';
                    document.body.appendChild(temp);
                    temp.focus();
                    temp.select();
                    document.execCommand('copy');
                    document.body.removeChild(temp);
                }
                showStatus(`${label} 已复制`, 'success');
            } catch (error) {
                console.error(error);
                showStatus(`${label} 复制失败，请手动复制`, 'error');
            }
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.textContent = msg;
            box.className = `status ${type}`;
            box.style.display = 'block';

            if (type === 'success') {
                setTimeout(() => {
                    box.style.display = 'none';
                }, 2800);
            }
        }
    </script>
</body>
</html>
